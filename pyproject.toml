[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "roomloop-booking-service"
version = "1.0.0"
description = "A small, transactional meeting-room booking service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "jinja2>=3.1,<4", "tzdata>=2025.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
browser = ["playwright>=1.50,<2"]

[tool.setuptools.packages.find]
include = ["roomloop*"]

[tool.setuptools.package-data]
roomloop = ["schema.sql", "data/*.json", "templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not browser'"
markers = ["browser: real Chromium interface tests (run separately)"]

[tool.ruff]
target-version = "py311"
line-length = 100
